version: 2

models:
  - name: stg_hotels
    columns:
      - name: hotel_id
        data_tests: [unique, not_null]
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_bookings
    columns:
      - name: booking_id
        data_tests: [unique, not_null]
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ['EUR']
  - name: stg_payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: is_duplicate_submission
        data_tests: [not_null]
