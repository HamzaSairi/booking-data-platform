

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "dbt", "airflow/logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "bigquery: interroge BigQuery (lent, scanne des octets, effets de bord)",
]
addopts = "-q -m 'not bigquery'"