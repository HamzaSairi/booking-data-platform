
[tool.ruff]
line-length = 100
target-version = "py312"   # aligne sur `python --version` dans ton venv WSL

[tool.ruff.lint]
select = ["E", "F", "I", "B"]   # erreurs, pyflakes, imports triés, bugs probables

[tool.pytest.ini_options]
pythonpath = [".", "airflow/dags"]
markers = ["bigquery: nécessite BigQuery — exclu du CI"]

[tool.ruff.lint.isort]
known-first-party = ["commun"]
